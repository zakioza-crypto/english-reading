<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>READ ALOUD LAB</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="wrap">
      <a class="brand" href="./">READ ALOUD LAB</a>
      <p>読解・構文・音読を一つの流れで学ぶ英語教材</p>
    </div>
  </header>

  <main class="wrap">

    <section class="hero">
      <span>10 LESSONS</span>

      <h1>Read. Understand. Speak.</h1>

      <p>
        英文を読む → 選択問題を解く → 根拠を確認する
        → 構文を理解する → 全文を音読する。
      </p>
    </section>

    <div id="cards" class="cards"></div>

  </main>

  <script>
    fetch('data/lessons.json')
      .then(response => response.json())
      .then(lessons => {

        const cards = document.getElementById('cards');

        cards.innerHTML = lessons.map(lesson => `
          <a class="card" href="lesson.html?id=${lesson.id}">
            <small>LESSON ${lesson.id}</small>

            <h2>${lesson.title}</h2>

            <p>${lesson.theme}</p>

            <b>Start →</b>
          </a>
        `).join('');

      })
      .catch(error => {
        console.error('Lesson data could not be loaded:', error);

        document.getElementById('cards').innerHTML = `
          <p>
            レッスンデータを読み込めませんでした。
          </p>
        `;
      });
  </script>

</body>
</html>
