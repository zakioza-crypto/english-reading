<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson | READ ALOUD LAB</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap topbar"><a class="brand" href="./">READ ALOUD LAB</a><a href="./">← Lessons</a></div></header><main class="wrap lesson" id="app"></main>
<script>
const id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
fetch('data.json').then(r=>r.json()).then(d=>render(d.lessons.find(x=>x.id===id)||d.lessons[0]));
function render(x){
window.currentLesson=x; document.title=x.title+' | READ ALOUD LAB';
app.innerHTML=`<p class="eyebrow">LESSON ${x.id} · ${esc(x.theme)}</p><h1>${esc(x.title)}</h1>
<section class="panel"><h2>01 · English</h2><div class="english">${x.english.split('\n\n').map(p=>'<p>'+esc(p)+'</p>').join('')}</div></section>
<section class="panel audio"><h2>Listen & Read Aloud</h2><p>ブラウザの英語音声を利用します。</p><select id="voice"></select><input id="rate" type="range" min=".65" max="1.15" value=".85" step=".05"><span id="rv">0.85</span><button id="play">▶ 再生</button><button id="stop">■ 停止</button></section>
<section class="panel"><h2>02 · Reading Questions</h2><p class="lead">選択肢を選ぶと、正解・不正解と解説が表示されます。</p>${x.questions.map((q,qi)=>`<article class="quiz" id="quiz-${qi}"><h3>Q${qi+1}. ${esc(q.question)}</h3><div class="options">${q.options.map((o,oi)=>`<button class="option" onclick="answer(${qi},${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('')}</div><div class="result" id="result-${qi}"></div></article>`).join('')}</section>
<section class="panel"><h2>03 · 段落ごとの読解</h2>${x.paragraphs.map(p=>`<article class="guide"><h3>Paragraph ${p.paragraph}</h3><p><b>役割：</b>${esc(p.role)}</p><p>${esc(p.text)}</p></article>`).join('')}</section>
<section class="panel"><h2>04 · Important Grammar</h2>${x.grammar.map(g=>`<article class="guide"><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p></article>`).join('')}</section>
<section class="panel"><h2>05 · 1文ずつの構文解説</h2><p class="lead">スラッシュはここでは使いません。文の構造を確認するためのページです。</p>${x.sentences.map(s=>`<details class="sentence"><summary><b>${s.no}.</b> ${esc(s.sentence)}</summary><div class="inside">${s.structure_items.map(z=>`<div class="note"><b>${esc(z[0])}</b><br>${esc(z[1])}</div>`).join('')}</div></details>`).join('')}</section>
<section class="panel slash-panel"><h2>06 · 全文スラッシュリーディング</h2><p class="lead">構文を確認したあと、ここだけを見ながら繰り返し音読してください。</p><div class="slash-text">${esc(x.slash_reading).replace(/\n/g,'<br>')}</div></section>
<section class="panel"><h2>07 · 日本語訳・内容</h2><p>${esc(x.translation)}</p></section>
<section class="panel"><h2>08 · Vocabulary</h2><div class="vocab">${x.vocab.map(v=>'<div>'+esc(v)+'</div>').join('')}</div></section>`;
setupVoice(x.english);
}
function answer(qi,oi){const q=currentLesson.questions[qi],box=document.querySelector('#quiz-'+qi),r=document.querySelector('#result-'+qi);box.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.correctIndex)b.classList.add('correct');if(i===oi&&i!==q.correctIndex)b.classList.add('wrong')});const ok=oi===q.correctIndex;r.className='result '+(ok?'ok':'ng');r.innerHTML=`<h4>${ok?'✓ 正解です！':'✕ 不正解です'}</h4>${ok?'':`<p><b>正解：</b>${String.fromCharCode(65+q.correctIndex)}. ${esc(q.answer)}</p>`}<p><b>解説：</b>${esc(q.explanation)}</p>`}
function setupVoice(text){let voices=[],sel=document.querySelector('#voice');function load(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('')}load();speechSynthesis.onvoiceschanged=load;rate.oninput=()=>rv.textContent=rate.value;play.onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.voice=voices[sel.value];u.lang='en-US';u.rate=+rate.value;speechSynthesis.speak(u)};stop.onclick=()=>speechSynthesis.cancel()}
</script></body></html>
