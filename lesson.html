<!doctype html>

<body>

  <header>
    <div class="wrap topbar">

      <a class="brand" href="./">
        READ ALOUD LAB
      </a>

      <a href="./">
        ← Lessons
      </a>

  <main class="wrap lesson" id="app">

    <!-- Lesson content will be inserted here -->

  <script>

    /*
     * =========================================================
     * 基本設定
     * =========================================================
     */

    const id =
      new URLSearchParams(location.search).get('id');


    /*
     * =========================================================
     * HTMLエスケープ
     * =========================================================
     */

    function esc(value) {

      return String(value).replace(
        /[&<>"]/g,
        character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;'
        }[character])
      );

    }


    /*
     * =========================================================
     * iPhone / iPad 判定
     * =========================================================
     */

    function isIOS() {

      /*
       * 通常のiPhone / iPad
       */

      if (
        /iPhone|iPad|iPod/i.test(
          navigator.userAgent
        )
      ) {
        return true;
      }


      /*
       * iPadOSではMacとして
       * userAgentを返す場合があるため、
       * タッチポイントも確認する。
       */

      if (
        navigator.platform === 'MacIntel' &&
        navigator.maxTouchPoints > 1
      ) {
        return true;
      }


      return false;

    }


    /*
     * =========================================================
     * Lesson読み込み
     * =========================================================
     */

    async function loadLesson() {

      try {

        /*
         * Lesson管理JSON
         */

        const response =
          await fetch(
            'data/lessons.json'
          );


        if (!response.ok) {

          throw new Error(
            'lessons.json could not be loaded.'
          );

        }


        const lessons =
          await response.json();


        /*
         * URLのidに対応するLessonを検索
         */

        const lessonInfo =
          lessons.find(
            lesson => lesson.id === id
          );


        /*
         * Lessonが存在しない場合
         */

        if (!lessonInfo) {

          document.querySelector(
            '#app'
          ).innerHTML = `

            <div class="panel">

              <h2>
                Lesson not found
              </h2>

              <p>
                指定されたLessonが見つかりません。
              </p>

              <p>
                <a href="./">
                  ← Lesson一覧に戻る
                </a>
              </p>

            </div>

          `;

          return;

        }


        /*
         * Lesson本体
         */

        const lessonResponse =
          await fetch(
            `data/lessons/${lessonInfo.file}`
          );


        if (!lessonResponse.ok) {

          throw new Error(
            `${lessonInfo.file} could not be loaded.`
          );

        }


        const lesson =
          await lessonResponse.json();


        /*
         * Lesson表示
         */

        render(lesson);

      }


      catch (error) {

        console.error(error);


        document.querySelector(
          '#app'
        ).innerHTML = `

          <div class="panel">

            <h2>
              Lessonを読み込めませんでした
            </h2>

            <p>
              Lessonデータの読み込み中に
              エラーが発生しました。
            </p>

            <p>
              <a href="./">
                ← Lesson一覧に戻る
              </a>
            </p>

          </div>

        `;

      }

    }

    /*
     * =========================================================
     * iOS「選択して読み上げ」対応
     * =========================================================
     *
     * 重要：
     *
     * JavaScriptからiOSの
     * 「選択項目の読み上げ」を直接起動する
     * 公開Web APIはありません。
     *
     * そのため、
     *
     * ① 英文を自動選択
     * ② ユーザーに「読み上げ」をタップしてもらう
     *
     * という方式にします。
     *
     */


    function setupIOSReading(text, targetId, suffix) {

      const iosAudio =
        document.querySelector(
          `#ios-audio-${suffix}`
        );


      const webAudio =
        document.querySelector(
          `#web-audio-${suffix}`
        );


      const iosButton =
        document.querySelector(
          `#ios-speak-${suffix}`
        );


      const iosGuide =
        document.querySelector(
          `#ios-guide-${suffix}`
        );


      /*
       * iOSではWeb Speech APIのUIを隠す
       */

      iosAudio.style.display =
        'block';


      webAudio.style.display =
        'none';


      /*
       * iPhone用ボタン
       */

      iosButton.addEventListener(
        'click',
        () => {

          selectText(targetId);


          /*
           * 説明を表示
           */

          iosGuide.style.display =
            'block';


          /*
           * 選択された英文が
           * 見える位置に移動
           */

          const targetText =
            document.querySelector(
              `#${targetId}`
            );


          targetText.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });


        }
      );

    }


    /*
     * =========================================================
     * 英文本文を自動選択
     * =========================================================
     */

    function selectText(targetId) {

      const targetText =
        document.querySelector(
          `#${targetId}`
        );


      if (!targetText) {
        return;
      }


      /*
       * Selection API
       */

      const selection =
        window.getSelection();


      selection.removeAllRanges();


      const range =
        document.createRange();


      range.selectNodeContents(
        targetText
      );


      selection.addRange(
        range
      );


      /*
       * 少し遅れてもう一度選択する。
       *
       * iOS Safariでは、
       * スクロールなどによって
       * 選択状態が消えるケースへの対策。
       */

      setTimeout(
        () => {

          const currentSelection =
            window.getSelection();


          if (
            currentSelection &&
            currentSelection.rangeCount === 0
          ) {

            const retryRange =
              document.createRange();


            retryRange.selectNodeContents(
              targetText
            );


            currentSelection.addRange(
              retryRange
            );

          }

        },
        100
      );

    }


    /*
     * =========================================================
     * 読解問題
     * =========================================================
     */

    function answer(
      questionIndex,
      selectedIndex
    ) {

      const question =
        window.currentLesson.questions[
          questionIndex
        ];


      const quiz =
        document.querySelector(
          `#quiz-${questionIndex}`
        );


      const result =
        document.querySelector(
          `#result-${questionIndex}`
        );


      /*
       * 選択肢を無効化
       */

      quiz
        .querySelectorAll('.option')
        .forEach(
          (button, index) => {

            button.disabled =
              true;


            /*
             * 正解
             */

            if (
              index ===
              question.correctIndex
            ) {

              button.classList.add(
                'correct'
              );

            }


            /*
             * 選択した答えが不正解
             */

            if (
              index === selectedIndex &&
              index !==
              question.correctIndex
            ) {

              button.classList.add(
                'wrong'
              );

            }

          }
        );


      const isCorrect =
        selectedIndex ===
        question.correctIndex;


      /*
       * 結果表示
       */

      result.className =
        `result ${isCorrect ? 'ok' : 'ng'}`;


      result.innerHTML = `

        <h4>

          ${
            isCorrect
              ? '✓ 正解です！'
              : '✕ 不正解です'
          }

        </h4>


        ${
          isCorrect
            ? ''
            : `

              <p>

                <b>
                  正解：
                </b>

                ${String.fromCharCode(
                  65 +
                  question.correctIndex
                )}.

                ${esc(
                  question.answer ||
                  question.options[
                    question.correctIndex
                  ]
                )}

              </p>

            `
        }


        <p>

          <b>
            解説：
          </b>

          ${esc(
            question.explanation
          )}

        </p>

      `;

    }


    /*
     * =========================================================
     * Web Speech API
     * =========================================================
     *
     * iPhoneでは使用しない。
     * PC / Androidなどで使用する。
     *
     */

    function setupVoice(text, suffix) {

      /*
       * iOSの場合は不要
       */

      if (isIOS()) {
        return;
      }


      /*
       * Speech Synthesisが
       * 利用できない環境
       */

      if (
        !('speechSynthesis' in window)
      ) {

        return;

      }


      let voices = [];


      const voiceSelect =
        document.querySelector(
          `#voice-${suffix}`
        );


      const playButton =
        document.querySelector(
          `#play-${suffix}`
        );


      const stopButton =
        document.querySelector(
          `#stop-${suffix}`
        );


      const rate =
        document.querySelector(
          `#rate-${suffix}`
        );


      const rateValue =
        document.querySelector(
          `#rv-${suffix}`
        );


      /*
       * ---------------------------------------------------------
       * Voiceスコア
       * ---------------------------------------------------------
       */

      function getVoiceScore(
        voice
      ) {

        let score = 0;


        const name =
          voice.name || '';


        const lang =
          voice.lang || '';


        /*
         * 高品質系
         */

        if (
          /enhanced|premium|natural|siri/i.test(
            name
          )
        ) {

          score += 10;

        }


        /*
         * US / GB
         */

        if (
          /en[-_]US/i.test(lang)
        ) {

          score += 5;

        }


        if (
          /en[-_]GB/i.test(lang)
        ) {

          score += 5;

        }


        /*
         * Local
         */

        if (
          voice.localService
        ) {

          score += 2;

        }


        /*
         * Default
         */

        if (
          voice.default
        ) {

          score += 1;

        }


        return score;

      }


      /*
       * ---------------------------------------------------------
       * Voice一覧
       * ---------------------------------------------------------
       */

      function loadVoices() {

        const rawVoices =
          speechSynthesis.getVoices();


        let englishVoices =
          rawVoices.filter(
            voice =>
              /^en/i.test(
                voice.lang
              ) ||
              /English/i.test(
                voice.name
              )
          );


        /*
         * おすすめ順
         */

        englishVoices.sort(
          (a, b) =>
            getVoiceScore(b) -
            getVoiceScore(a)
        );


        voices =
          englishVoices;


        /*
         * フォールバック
         */

        if (
          voices.length === 0
        ) {

          voices =
            rawVoices;

        }


        /*
         * Voice一覧表示
         */

        voiceSelect.innerHTML =
          voices
            .map(
              (voice, index) => {

                let displayName =
                  voice.name;


                if (
                  /enhanced|premium|natural|siri/i.test(
                    voice.name
                  )
                ) {

                  displayName +=
                    ' ⭐ (高音質)';

                }


                if (
                  voice.localService
                ) {

                  displayName +=
                    ' · Local';

                }
                else {

                  displayName +=
                    ' · Remote';

                }


                return `

                  <option
                    value="${index}"
                  >

                    ${esc(displayName)}
                    (${esc(voice.lang)})

                  </option>

                `;

              }
            )
            .join('');

      }


      /*
       * 初回読み込み
       */

      loadVoices();


      /*
       * iPhoneなどではVoiceが
       * 非同期で取得される場合がある。
       */

      speechSynthesis.onvoiceschanged =
        loadVoices;


      /*
       * ---------------------------------------------------------
       * 速度
       * ---------------------------------------------------------
       */

      rate.addEventListener(
        'input',
        () => {

          rateValue.textContent =
            rate.value;

        }
      );


      /*
       * ---------------------------------------------------------
       * 再生
       * ---------------------------------------------------------
       */

      playButton.addEventListener(
        'click',
        () => {

          speechSynthesis.cancel();


          /*
           * Voiceがまだ取得できていない場合
           */

          if (
            voices.length === 0
          ) {

            loadVoices();

          }


          const utterance =
            new SpeechSynthesisUtterance(
              text
            );


          const selectedVoice =
            voices[
              Number(
                voiceSelect.value
              )
            ];


          if (
            selectedVoice
          ) {

            utterance.voice =
              selectedVoice;


            utterance.lang =
              selectedVoice.lang;

          }
          else {

            utterance.lang =
              'en-US';

          }


          utterance.rate =
            Number(
              rate.value
            );


          utterance.pitch =
            1.0;


          speechSynthesis.speak(
            utterance
          );

        }
      );


      /*
       * ---------------------------------------------------------
       * 停止
       * ---------------------------------------------------------
       */

      stopButton.addEventListener(
        'click',
        () => {

          speechSynthesis.cancel();

        }
      );

    }


    /*
     * =========================================================
     * Lesson開始
     * =========================================================
     */

    loadLesson();

  </script>

</body>

</html>
